plugins {
    id 'com.android.application'
}

android {
    namespace 'com.easypay.safepay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.easypay.safepay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly; use your own keystore for the Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google code scanner: camera QR scanning without a camera permission
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
